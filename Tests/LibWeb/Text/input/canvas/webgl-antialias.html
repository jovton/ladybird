<!doctype html>
<script src="../include.js"></script>
<script>
    // Draws a red triangle over the lower-left half of the drawing buffer, on black. Its diagonal edge gets in-between
    // shades of red exactly when the drawing buffer is antialiased.
    function drawTriangle(gl) {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, "attribute vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0); }");
        gl.compileShader(vertexShader);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, "precision mediump float; void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }");
        gl.compileShader(fragmentShader);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1]), gl.STATIC_DRAW);
        const location = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);

        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    test(() => {
        for (const version of ["webgl", "webgl2"]) {
            for (const antialias of [true, false]) {
                const canvas = document.createElement("canvas");
                canvas.width = 16;
                canvas.height = 16;
                const gl = canvas.getContext(version, { antialias, preserveDrawingBuffer: true });
                const attributes = gl.getContextAttributes();
                const label = `${version} antialias=${antialias}`;

                const multisampled = gl.getParameter(gl.SAMPLES) > 0;
                println(`${label}: attribute matches the drawing buffer's samples: ${attributes.antialias === multisampled}`);
                if (!antialias)
                    println(`${label}: not antialiased when not requested: ${attributes.antialias === false}`);

                drawTriangle(gl);
                const pixels = new Uint8Array(16 * 16 * 4);
                gl.readPixels(0, 0, 16, 16, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
                let inBetween = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                    if (pixels[i] > 0 && pixels[i] < 255)
                        ++inBetween;
                }
                println(`${label}: readPixels sees the triangle: ${pixels[0] === 255 && pixels[(16 * 16 - 1) * 4] === 0}`);
                println(`${label}: edge is smooth exactly when antialiased: ${attributes.antialias === inBetween > 0}`);

                // Drawing the canvas into a 2D canvas reads the drawing buffer back as well. GL's bottom-left corner is
                // the 2D canvas's top-left one's opposite.
                const canvas2d = document.createElement("canvas");
                canvas2d.width = 16;
                canvas2d.height = 16;
                const context = canvas2d.getContext("2d");
                context.drawImage(canvas, 0, 0);
                const bottomLeft = context.getImageData(0, 15, 1, 1).data;
                const topRight = context.getImageData(15, 0, 1, 1).data;
                println(`${label}: drawImage sees the triangle: ${bottomLeft[0] === 255 && topRight[0] === 0}`);
            }
        }
    });
</script>
